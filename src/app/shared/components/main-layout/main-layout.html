<div class="app-layout">

  <!-- SIDEBAR -->

  <app-sidebar
    [isOpen]="sidebarOpen"
    (closeSidebar)="closeSidebar()"
  ></app-sidebar>


  <!-- MAIN AREA -->

  <div
    class="main-area"
    [class.sidebar-collapsed]="!sidebarOpen"
  >

    <!-- NAVBAR -->

    <app-navbar
      (menuToggle)="toggleSidebar()"
    ></app-navbar>


    <!-- PAGE CONTENT -->

    <main class="page-container">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
