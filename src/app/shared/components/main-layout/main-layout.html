<div class="app-layout">
  <div
    class="top-progress-bar"
    [class.visible]="loadingService.state() !== 'hidden'"
    [class.loading]="loadingService.state() === 'loading'"
    [class.finishing]="loadingService.state() === 'finishing'"
    aria-hidden="true"
  ></div>

  <!-- SIDEBAR -->

  <app-sidebar
    [isOpen]="sidebarOpen"
    (closeSidebar)="closeSidebar()"
  ></app-sidebar>


  <!-- MAIN AREA -->

  <div
    class="main-area"
    [class.sidebar-collapsed]="!sidebarOpen"
  >

    <!-- NAVBAR -->

    <app-navbar
      (menuToggle)="toggleSidebar()"
    ></app-navbar>


    <!-- PAGE CONTENT -->

    <main class="page-container">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
